[env:adafruit_trellis_m4]
platform = atmelsam
board = adafruit_trellis_m4
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit NeoTrellis M4 Library
  adafruit/Adafruit SPIFlash
  adafruit/Adafruit ZeroTimer Library
  adafruit/Adafruit NeoPixel

lib_ignore =
  MIDIUSB ; TinyUSB already handles USB MIDI for us; the classic MIDIUSB lib clashes on SAMD/TinyUSB cores

build_flags =
  -DUSB_MANUFACTURER="\"LoFiSampler\""
  -DUSB_PRODUCT="\"NTM4 Sampler\""
  -DUSE_TINYUSB
