[env:adafruit_trellis_m4]
platform = atmelsam
board = adafruit_trellis_m4
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit NeoTrellis M4 Library
  adafruit/Adafruit SPIFlash
  adafruit/Adafruit ZeroTimer Library
  adafruit/Adafruit NeoPixel
  adafruit/Adafruit TinyUSB Library

# Arduino's legacy MIDIUSB library collides with TinyUSB MIDI classes; ignore it so
# Adafruit_TinyUSB_Arduino is the single USB stack provider.
lib_ignore =
  MIDIUSB

# Keep LittleFS vendored locally so builds work offline.
lib_extra_dirs =
  lib

build_flags =
  -DUSE_TINYUSB
